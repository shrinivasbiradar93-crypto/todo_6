<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-6">
                <div class="card">
                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="entertodo"> ENTER TODO</label>
                                <input type="text" id="entertodo" class="form-control" required
                                    placeholder="Enter Your Todo">

                            </div>

                            <div class="form-group">
                                <label for="todoDescription"> TODO DESCRIPTION</label>
                                <input type="text" id="todoDescription" class="form-control" required
                                    placeholder="Enter Todo Description">

                            </div>

                            <button type="submit" class="btn btn-outline-primary btn-block btn-sm" id="addTodo">
                                Add Todo
                            </button>

                            <button type="button" class="btn btn-outline-danger btn-block btn-sm d-none"
                                id="updateTodo">
                                Update Todo
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todoList">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>

</html>
